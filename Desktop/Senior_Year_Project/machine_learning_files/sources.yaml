# ─────────────────────────────────────────────
#  Bay Area Traffic Forecast — Source Config
# ─────────────────────────────────────────────

# --- 511 SF Bay API ---
transit_511:
  api_key: "YOUR_511_API_KEY"          # register free at 511.org/open-data
  base_url: "https://api.511.org/transit"
  agencies:                            # all major Bay Area operators
    - id: "BA"
      name: "BART"
    - id: "CT"
      name: "Caltrain"
    - id: "VTA"
      name: "VTA"
    - id: "SF"
      name: "Muni"
    - id: "AC"
      name: "AC Transit"
    - id: "SM"
      name: "SamTrans"
    - id: "WTA"
      name: "WETA Ferries"
    - id: "GF"
      name: "Golden Gate Transit"

# --- BART Ridership Reports ---
bart:
  ridership_base_url: "https://www.bart.gov/sites/default/files/docs/ridership"
  # Key stations for this project (Diridon is Caltrain/VTA, not BART)
  key_stations:
    - "Millbrae"
    - "SFO"
    - "Embarcadero"
    - "Montgomery St."
    - "Powell St."
    - "Civic Center"
    - "16th St. Mission"
    - "Balboa Park"
    - "Daly City"
    - "Fremont"
    - "Warm Springs"
    - "Berryessa"
    - "Downtown Berkeley"
    - "Oakland 19th St."
    - "Oakland Coliseum"

# --- Caltrans PeMS ---
pems:
  base_url: "https://pems.dot.ca.gov"
  district: 4                          # District 4 = Bay Area
  data_type: "station_5min"            # 5-minute aggregated sensor data
  # PeMS requires a manual browser session for download; see fetch_pems_roads.py

# --- Weather: Open-Meteo (no key required) ---
weather:
  base_url: "https://archive-api.open-meteo.com/v1/archive"
  forecast_url: "https://api.open-meteo.com/v1/forecast"
  variables:
    - "precipitation"
    - "temperature_2m"
    - "windspeed_10m"
    - "weathercode"
    - "cloudcover"
  # Station coordinates for per-location weather
  station_coords:
    diridon:       { lat: 37.3294, lng: -121.9022 }
    embarcadero:   { lat: 37.7929, lng: -122.3969 }
    millbrae:      { lat: 37.5994, lng: -122.3869 }
    fremont_bart:  { lat: 37.5574, lng: -121.9761 }
    berryessa:     { lat: 37.3484, lng: -121.9027 }
    sfo:           { lat: 37.6213, lng: -122.3790 }
    oakland_19th:  { lat: 37.8081, lng: -122.2682 }

# --- Events: NHL (Sharks) ---
nhl:
  base_url: "https://api-web.nhle.com/v1"
  sharks_team_id: "SJS"
  # SAP Center, San Jose — key venue for transit spike analysis
  sap_center: { lat: 37.3327, lng: -121.9010 }

# --- Events: Ticketmaster ---
ticketmaster:
  api_key: "YOUR_TICKETMASTER_API_KEY"  # register at developer.ticketmaster.com
  base_url: "https://app.ticketmaster.com/discovery/v2"
  venues:
    sap_center:   "KovZpZAEkvAA"        # SAP Center, San Jose
    chase_center: "KovZpZAFnI0A"        # Chase Center, San Francisco
    oracle_park:  "KovZpZAFk6AA"        # Oracle Park (Giants), San Francisco
    levis_stadium: "KovZpZAF6kvA"       # Levi's Stadium (49ers), Santa Clara
