# ─────────────────────────────────────────────────────────────────────────────
#  Bay Area Transit Forecast — Model Configuration
# ─────────────────────────────────────────────────────────────────────────────

# ── Data / splits ─────────────────────────────────────────────────────────────
data:
  granularity: "monthly"          # actual modeled data: BART OD station-month ridership
  resample_freq: "MS"             # month-start frequency
  context_length_steps: 24        # 24 months of history fed as context
  forecast_horizon_steps: 6       # predict the next 6 months

  # Chronological splits — no data leakage
  # train: everything up to train_end
  # val  : train_end < ts <= val_end
  # test : ts > val_end
  # Windows sit entirely after the 2020 ridership collapse. The feature store
  # jumps 2019 -> 2022 (no 2020-21 data at all), so training that starts
  # earlier straddles a ~2.8x level break. 2024 became available once
  # bart_od_from_csv.py could rebuild the store, which is what allows these
  # windows to move forward and still leave 24 training months.
  train_start: "2022-01-01"
  train_end: "2024-12-31"   # train: Jan 2022 - Dec 2024 (36 months)
  val_end:   "2025-06-30"   # val: Jan-Jun 2025 | test: Jul-Dec 2025
  # Test spans 6 months, matching forecast_horizon_steps below, so every
  # model is scored over the same window. A longer test split scores the
  # naive baseline across every test month while the others forecast only
  # `forecast_horizon_steps` ahead, which is not a like-for-like ranking.
  #
  # 2025-H2 is a clean holdout: Prophet's yearly_fourier_order and SARIMA's
  # airline order were both selected by inspecting 2024-H2, so that window
  # can no longer serve as a test set. Tune on validation only.

# ── Chronos (chronos-t5-small) ────────────────────────────────────────────────
# The config key stays `chronos2` because code reads cfg["chronos2"]; the
# checkpoint named below is from the Chronos-1 (T5) family.
chronos2:
  model_id: "amazon/chronos-t5-small"   # options: tiny / mini / small / base / large
  device: "cpu"                          # "cuda" if GPU, "mps" for Apple Silicon, "cpu" for Cloud Run
  batch_size: 32
  quantile_levels: [0.1, 0.5, 0.9]      # P10 / P50 / P90
  # Chronos draws sample paths, so inference is stochastic. Unseeded, two
  # identical runs produced 8.26% and 8.06% WAPE — a number nobody can
  # reproduce. Seed it so a published figure is traceable.
  seed: 42
  # Monthly data settings (BART OD is monthly, not 15-min)
  context_length_steps: 24              # use last 24 months as context (~2 years)
  prediction_length_steps: 6            # forecast 6 months ahead

# ── Fine-tuning (AutoGluon) ───────────────────────────────────────────────────
finetune:
  time_limit_seconds: 3600        # 1 hour budget; increase for best_quality
  presets: "medium_quality"       # fast_training | medium_quality | best_quality
  eval_metric: "MASE"             # scale-independent; MASE < 1 means MAE below the in-sample seasonal-naive error;
                                  # not a comparison with the SeasonalNaive model on the test window

# ── Prophet baseline ──────────────────────────────────────────────────────────
prophet:
  seed: 42                   # interval sampling is stochastic; see fit_station
  yearly_seasonality: true
  # Fourier terms for the yearly cycle. Prophet's own default when
  # yearly_seasonality is simply `true` is 10, which is 20 regressors — far too
  # many for ~30 monthly observations per station, and it collapses the
  # prediction interval. Raise only with substantially more history.
  yearly_fourier_order: 4
  weekly_seasonality: false
  daily_seasonality: false
  changepoint_prior_scale: 0.05   # flexibility of trend — low = smooth

# ── Interval calibration (P10/P90) ────────────────────────────────────────────
# Conformal widening of each model's band, applied to the test forecasts by
# models/baselines/benchmarks.py. P50 is never changed.
#
# scheme: split (default, Sprint 4) — one quantile from the validation split's
#   forecasts (fit ending train_end).
# scheme: rolling (Sprint 5) — weighted quantile over forecasts from every
#   monthly origin first_origin .. val_end - 1 month whose target is on or
#   before val_end, weight 0.5**(age / half_life months).
#
# method: shift_relative (Sprint 6) — the rolling pool above, but the band is
#   re-centred: P50 * (1 + m -/+ w), m the lower weighted median of the
#   relative error (y - P50) / P50, weight 0.5**(age / bias_half_life), w the
#   weighted conformal quantile of |r - m| with half_life. bias_at: as_of
#   estimates m at the forecast origin; origin, at each pool row's own origin.
#
# Chosen per model on data up to val_end only (evaluation/interval_study.py).
# Sprint 5 rule, fixed before any number was seen: 75-85% coverage with
# neither tail above 15% misses on BOTH 2024-H2 and 2025-H1; lowest mean
# interval score; a model with no qualifier keeps its entry. SARIMA and
# Chronos-1 had none. Sprint 6 (the same test, SARIMA and Chronos-1 only,
# per model) found a bias-shifted band for Chronos-1; SARIMA still has
# none. See docs/interval-calibration.md. A model not listed keeps its own
# band.
calibration:
  level: 0.8
  models:
    SeasonalNaive: {method: asym_relative, group: horizon, scheme: rolling, half_life: 6, first_origin: "2023-12-31"}
    SARIMA:        {method: none, reason: "no method passed validation"}
    Prophet:       {method: relative, group: pooled, scheme: rolling, half_life: 6, first_origin: "2023-12-31"}
    Chronos:       {method: shift_relative, group: horizon, scheme: rolling, half_life: 6, bias_half_life: 1,
                    bias_at: as_of, first_origin: "2023-12-31", validated_for: "amazon/chronos-t5-small"}

# ── Serving ───────────────────────────────────────────────────────────────────
serving:
  nightly_refresh_cron: "0 2 * * *"   # 2am PT every night
