# The publish gate (machine_learning_files/ingest_gate.py run_gate).
gate:
  expected_stations: 50
  # The committed store, the gate's reference (relative to the repo root).
  tracked_store: "data/processed/feature_store.parquet"
  # Covariates only; ridership must match exactly.
  covariate_rtol: 1.0e-9
  # SARIMA fitted on the candidate through as_of must reproduce the published
  # figure on the tracked store's next six months.
  sarima_backtest:
    as_of: "2025-06-30"
    wape_pct: 3.21

# The one object that is overwritten: the API reads it to find the current store.
serving_pointer: "processed/serving.json"
