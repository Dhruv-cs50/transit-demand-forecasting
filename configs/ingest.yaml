# ─────────────────────────────────────────────────────────────────────────────
#  Cloud ingestion job — settings
#  Read by machine_learning_files/cloud_ingest.py (docs/cloud-ingestion-design.md §5).
#  The weather locations and the NHL team stay in configs/sources.yaml.
# ─────────────────────────────────────────────────────────────────────────────

# The bucket. `--bucket` and then $INGEST_BUCKET override it.
bucket: "gs://cs-163-final-project-tra-f1136-transit-data"

# Never fetch before this date: the 2019-2025 archives are hand-seeded, are
# never fetched again, and are never replaced or deleted.
fetch_floor: "2026-01-01"

# A month is fetched only once it ended at least this many days ago
# (Open-Meteo's archive lags the present).
archive_lag_days: 7

# Cloud Scheduler cron (America/Los_Angeles). Informational: the schedule lives
# in the `gcloud scheduler jobs create` command, not here.
schedule: "15 3 * * *"

# The 20 inputs the committed feature store was built from, keyed by the object
# name they must have in the bucket: the 2019/2022/2023/2024 BART zips, the 12
# 2025 workbooks as loose files (data/MANIFEST.md's "Ridership 2025 (1).zip"
# holds the same months but was not available to upload) and the four
# weather/events archives. A missing object or a different sha256 fails the run
# before anything is built. Objects added later (2026 BART workbooks, fetched
# 2026 weather/events) are not pinned; the gate covers them.
pinned_inputs:
  "raw/bart/Ridership Report 2019.zip": "599465433bb1f5c28503fe36d4345ae5d3820e7d1fd34aea287e2d961b2b6c92"
