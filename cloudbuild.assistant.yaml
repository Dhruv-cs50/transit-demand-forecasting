# Builds the route assistant image (Dockerfile.assistant) and pushes it to
# Artifact Registry as transit-assistant:$_TAG (the commit, so a live revision
# can be traced to code). Push only; it does not deploy. Runbook: docs/assistant.md
#
# Tag the build with the commit:
#   gcloud builds submit --config=cloudbuild.assistant.yaml \
#     --substitutions=_TAG=$(git rev-parse --short HEAD) .
# A bare build tags the image "latest" and cannot be traced to a commit; tag real builds.
#
# Deploy by digest, not by tag, so a revision names exactly the image it runs:
#   P=cs-163-final-project-tra-f1136
#   IMG=us-west2-docker.pkg.dev/$P/transit-repo/transit-assistant
#   DIGEST=$(gcloud artifacts docker images describe $IMG:$(git rev-parse --short HEAD) \
#     --format='value(image_summary.digest)')
#   gcloud run deploy transit-assistant --region us-west2 --image $IMG@$DIGEST ...
# (the full deploy command, with its env vars and secrets, is in docs/assistant.md)
substitutions:
  _TAG: latest

steps:
  # Build with Dockerfile.assistant (linux/amd64 for Cloud Run)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - --platform=linux/amd64
      - -t
      - us-west2-docker.pkg.dev/$PROJECT_ID/transit-repo/transit-assistant:$_TAG
      - -f
      - Dockerfile.assistant
      - .

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - us-west2-docker.pkg.dev/$PROJECT_ID/transit-repo/transit-assistant:$_TAG

images:
  - us-west2-docker.pkg.dev/$PROJECT_ID/transit-repo/transit-assistant:$_TAG

options:
  logging: CLOUD_LOGGING_ONLY
