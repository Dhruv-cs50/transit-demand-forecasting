steps:
  # Build the serving image using Dockerfile.api (linux/amd64 for Cloud Run)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - --platform=linux/amd64
      - -t
      - us-west2-docker.pkg.dev/$PROJECT_ID/transit-repo/transit-api:tag1
      - -f
      - Dockerfile.api
      - .

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - us-west2-docker.pkg.dev/$PROJECT_ID/transit-repo/transit-api:tag1

images:
  - us-west2-docker.pkg.dev/$PROJECT_ID/transit-repo/transit-api:tag1

options:
  logging: CLOUD_LOGGING_ONLY
